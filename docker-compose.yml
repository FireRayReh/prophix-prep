services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fpa
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      Database__Provider: Postgres          # "__" maps to ":" in .NET config
      ConnectionStrings__Postgres: Host=db;Database=fpa;Username=postgres;Password=postgres
    depends_on:
      db: { condition: service_healthy }
